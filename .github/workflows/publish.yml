name: "Publish"
on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jameshenry/publish-shell-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
